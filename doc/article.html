<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>文章列表 · 小陈同学-STUCDX</title>
  <meta name="description" content="浏览小陈同学-STUCDX 的全部文章，通过搜索、标签和分类找到你感兴趣的内容。" />
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
            border: 'hsl(var(--border))',
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            ring: 'hsl(var(--ring))',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --border: 214.3 31.8% 91.4%;
      --ring: 221.2 83.2% 53.3%;
    }
    .dark {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
      --primary: 217.2 91.2% 59.8%;
      --primary-foreground: 222.2 47.4% 11.2%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
      --ring: 224.3 76.3% 48%;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      transition: background-color 0.3s, color 0.3s;
    }
    .nav-link {
      color: hsl(var(--muted-foreground));
      transition: color 0.2s;
      text-decoration: none;
    }
    .nav-link:hover {
      color: hsl(var(--foreground));
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      z-index: 60;
      min-width: 160px;
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 0.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      padding: 0.5rem;
      top: 100%;
      margin-top: 0.25rem;
      right: 0;
    }
    .dropdown-menu.show {
      display: block;
    }
    .dropdown-menu a,
    .dropdown-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      color: hsl(var(--foreground));
      transition: background-color 0.15s;
      white-space: nowrap;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .dropdown-menu a:hover,
    .dropdown-menu button:hover {
      background-color: hsl(var(--accent));
      color: hsl(var(--accent-foreground));
    }
    .dropdown-wrapper {
      position: relative;
      display: inline-block;
    }
    .lucide-icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: middle;
    }
    
    /* ========== 关键修复：图片容器固定高度 + 图片裁剪 ========== */
    .article-image-wrapper {
      position: relative;
      width: 100%;
      height: 180px; /* 固定高度，所有卡片统一 */
      overflow: hidden;
      background-color: hsl(var(--muted));
    }
    .article-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 图片裁剪填充，保持比例，不拉伸 */
      display: block;
    }
    
    /* 卡片整体样式 */
    .article-card {
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      height: 100%; /* 让所有卡片在同一行等高 */
    }
    .article-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }
    
    /* 网格容器使用align-items: stretch让卡片等高 */
    #articles-grid {
      align-items: stretch;
    }
    
    .tag-pill, .category-block {
      transition: all 0.2s;
      cursor: pointer;
    }
    .tag-pill.active {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    .category-block.active {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    .search-input:focus {
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 3px hsla(var(--ring), 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

                                </div>

        <!-- 主内容区 -->

          </div>
        </div>
      </main>

      <footer class="bg-muted/50 py-12 mt-auto">
        <div class="container mx-auto px-4 text-center">
          <div class="mb-6"><h3 class="text-2xl font-bold">小陈同学-STUCDX</h3></div>

          <div class="flex flex-wrap justify-center items-center gap-x-6 gap-y-2 text-sm text-muted-foreground">

  </div>

  <script>
    // ========== 文章数据（包含真实图片URL和占位图片） ==========
    const articles = [
      { 
        id: 1, 
        title: "免费服务器搭建网站", 
        excerpt: "365Webhost是一个提供免费虚拟主机和域名注册服务的网站", 
        category: "白嫖", 
        tags: ["白嫖", "网页"], 
        date: "2025-04-24", 
        readTime: "3 分钟",
        image: "https://onemouse.indevs.in/25e24/article_cover.png" // 书本/学习图片
      },
    ];

    let currentCategory = 'all';
    let currentTag = 'all';
    let searchQuery = '';

    const articlesGrid = document.getElementById('articles-grid');
    const emptyState = document.getElementById('empty-state');
    const resultCount = document.getElementById('result-count');
    const searchInput = document.getElementById('search-input');
    const categoryBlocks = document.querySelectorAll('#category-filters .category-block');
    const tagPills = document.querySelectorAll('#tag-filters .tag-pill');

    // ========== 渲染函数（修复图片问题） ==========
    function renderArticles(filtered) {
      articlesGrid.innerHTML = '';
      
      if (filtered.length === 0) {
        articlesGrid.classList.add('hidden');
        emptyState.classList.remove('hidden');
      } else {
        articlesGrid.classList.remove('hidden');
        emptyState.classList.add('hidden');
        
        filtered.forEach(article => {
          const card = document.createElement('div');
          card.className = 'article-card bg-card border border-border rounded-xl overflow-hidden cursor-pointer';
          
          // 构建图片HTML：有图片显示图片，无图片显示占位符
          const imageHTML = article.image 
            ? `<img src="${article.image}" alt="${article.title}" loading="lazy" />`
            : `<div class="flex items-center justify-center h-full text-muted-foreground">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
               </div>`;
          
          card.innerHTML = `
            <div class="article-image-wrapper">
              ${imageHTML}
            </div>
            <div class="p-4 flex flex-col flex-1">
              <div class="flex items-center gap-2 mb-2">
                <span class="text-xs px-2 py-0.5 rounded-full bg-primary/10 text-primary font-medium">${getCategoryName(article.category)}</span>
                <span class="text-xs text-muted-foreground">${article.date}</span>
              </div>
              <h3 class="font-semibold text-base mb-2 leading-snug hover:text-primary transition-colors">${article.title}</h3>
              <p class="text-sm text-muted-foreground mb-3 flex-1">${article.excerpt}</p>
              <div class="flex items-center justify-between mt-auto">
                <div class="flex flex-wrap gap-1">
                  ${article.tags.map(t => `<span class="text-xs px-2 py-0.5 rounded-full bg-muted text-muted-foreground">#${t}</span>`).join('')}
                </div>
                <span class="text-xs text-muted-foreground whitespace-nowrap ml-2">${article.readTime}</span>
              </div>
            </div>
          `;
          
          card.addEventListener('click', () => {
            // 实际项目中跳转到文章详情页
            window.location.href = `article.html?id=${article.id}`;
          });
          
          articlesGrid.appendChild(card);
        });
      }
      
      resultCount.querySelector('span').textContent = filtered.length;
    }

    function getCategoryName(cat) {
      const map = { tech: '技术', life: '生活', study: '学习', thoughts: '随想' };
      return map[cat] || cat;
    }

    function filterArticles() {
      let filtered = articles;
      if (currentCategory !== 'all') filtered = filtered.filter(a => a.category === currentCategory);
      if (currentTag !== 'all') filtered = filtered.filter(a => a.tags.includes(currentTag));
      if (searchQuery.trim()) {
        const q = searchQuery.trim().toLowerCase();
        filtered = filtered.filter(a => 
          a.title.toLowerCase().includes(q) || 
          a.excerpt.toLowerCase().includes(q) || 
          a.tags.some(t => t.toLowerCase().includes(q))
        );
      }
      renderArticles(filtered);
    }

    function updateActiveUI() {
      categoryBlocks.forEach(b => b.classList.toggle('active', b.dataset.category === currentCategory));
      tagPills.forEach(p => p.classList.toggle('active', p.dataset.tag === currentTag));
    }

    // 事件监听
    categoryBlocks.forEach(b => b.addEventListener('click', () => {
      currentCategory = b.dataset.category;
      updateActiveUI();
      filterArticles();
    }));
    
    tagPills.forEach(p => p.addEventListener('click', () => {
      currentTag = p.dataset.tag;
      updateActiveUI();
      filterArticles();
    }));
    
    searchInput.addEventListener('input', e => {
      searchQuery = e.target.value;
      filterArticles();
    });

    // 初始渲染
    renderArticles(articles);

    // ========== 主题与下拉菜单 ==========
    (function() {
      const s = localStorage.getItem('theme');
      const p = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (s === 'dark' || (!s && p)) { 
        document.documentElement.classList.add('dark'); 
        document.documentElement.classList.remove('light'); 
      } else if (s === 'light') { 
        document.documentElement.classList.add('light'); 
        document.documentElement.classList.remove('dark'); 
      }
      updateThemeIcons();
    })();
    
    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) { 
        document.documentElement.classList.remove('dark'); 
        document.documentElement.classList.add('light'); 
        localStorage.setItem('theme', 'light'); 
      } else { 
        document.documentElement.classList.add('dark'); 
        document.documentElement.classList.remove('light'); 
        localStorage.setItem('theme', 'dark'); 
      }
      updateThemeIcons();
    }
    
    function updateThemeIcons() {
      const sun = document.getElementById('sun-icon');
      const moon = document.getElementById('moon-icon');
      if (!sun || !moon) return;
      const isDark = document.documentElement.classList.contains('dark');
      sun.classList.toggle('hidden', isDark);
      moon.classList.toggle('hidden', !isDark);
    }
    
    function toggleDropdown(id) {
      const d = document.getElementById(id); 
      if (!d) return;
      const open = d.classList.contains('show');
      document.querySelectorAll('.dropdown-menu.show').forEach(x => x.classList.remove('show'));
      if (!open) d.classList.add('show');
    }
    
    document.addEventListener('click', e => { 
      if (!e.target.closest('.dropdown-wrapper')) {
        document.querySelectorAll('.dropdown-menu.show').forEach(x => x.classList.remove('show')); 
      }
    });
    
    document.addEventListener('keydown', e => { 
      if (e.key === 'Escape') {
        document.querySelectorAll('.dropdown-menu.show').forEach(x => x.classList.remove('show')); 
      }
    });
  </script>
</body>
