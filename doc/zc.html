<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 注册登录</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
        .group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #0070f3; color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        .hidden { display: none; }
        .msg { margin-top: 10px; color: red; }
        .success { color: green; }
    </style>
</head>
<body>

    <!-- ===== 未登录界面 ===== -->
    <div id="auth-box">
        <h2>注册</h2>
        <div class="group">
            <input type="email" id="regEmail" placeholder="邮箱">
        </div>
        <div class="group">
            <input type="password" id="regPassword" placeholder="密码（≥6位）">
        </div>
        <button id="regBtn">注册</button>

        <hr>

        <h2>登录</h2>
        <div class="group">
            <input type="email" id="loginEmail" placeholder="邮箱">
        </div>
        <div class="group">
            <input type="password" id="loginPassword" placeholder="密码">
        </div>
        <button id="loginBtn">登录</button>
        <div id="msg" class="msg"></div>
    </div>

    <!-- ===== 登录成功界面 ===== -->
    <div id="user-box" class="hidden">
        <h2>✅ 已登录</h2>
        <p>欢迎，<span id="userEmail"></span>！</p>
        <button id="logoutBtn">退出登录</button>
        <div id="userMsg" class="msg"></div>
    </div>

    <script>
        // ========== 1. 唯一初始化（只声明一次） ==========
        const SUPABASE_URL = 'https://yruzwtugitxfmflbtdfp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZuiLf2QX-6HB82kvEDLErQ_ML289S4m';   // ⚠️ 务必更换！

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 2. 工具函数 ==========
        function showMsg(element, text, isSuccess = false) {
            element.textContent = text;
            element.className = 'msg' + (isSuccess ? ' success' : '');
        }

        // 切换界面
        function switchToUser(user) {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('user-box').classList.remove('hidden');
            document.getElementById('userEmail').textContent = user.email;
        }

        function switchToAuth() {
            document.getElementById('auth-box').classList.remove('hidden');
            document.getElementById('user-box').classList.add('hidden');
        }

        // ========== 3. 核心业务函数（挂载到 window 以便 onclick 调用，但这里改用监听器） ==========
        async function handleSignUp() {
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const msgEl = document.getElementById('msg');

            if (!email || password.length < 6) {
                showMsg(msgEl, '请填写有效邮箱，且密码至少 6 位');
                return;
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                showMsg(msgEl, '❌ 注册失败：' + error.message);
            } else {
                showMsg(msgEl, '✅ 注册成功！已自动登录（若未自动跳转，请稍后重试）', true);
                // 注册成功后，用当前会话直接切换界面
                await checkSession();   // 尝试自动登录
            }
        }

        async function handleSignIn() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const msgEl = document.getElementById('msg');

            if (!email || !password) {
                showMsg(msgEl, '请填写完整');
                return;
            }

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                showMsg(msgEl, '❌ 登录失败：' + error.message);
            } else {
                showMsg(msgEl, '✅ 登录成功！', true);
                await checkSession();
            }
        }

        async function handleSignOut() {
            await supabaseClient.auth.signOut();
            switchToAuth();
            document.getElementById('msg').textContent = '已退出';
            document.getElementById('msg').className = 'msg';
        }

        // 检查当前会话
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                switchToUser(session.user);
            } else {
                switchToAuth();
            }
        }

        // ========== 4. 绑定事件（避免 onclick 污染全局） ==========
        document.addEventListener('DOMContentLoaded', function() {
            // 注册按钮
            document.getElementById('regBtn').addEventListener('click', handleSignUp);
            // 登录按钮
            document.getElementById('loginBtn').addEventListener('click', handleSignIn);
            // 退出按钮
            document.getElementById('logoutBtn').addEventListener('click', handleSignOut);

            // 初始检查
            checkSession();

            // 监听认证状态变化（例如在其他页面退出）
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    switchToUser(session.user);
                } else if (event === 'SIGNED_OUT') {
                    switchToAuth();
                }
            });
        });
    </script>
</body>
</html>
