<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase 免费注册登录</title>
    <!-- 引入 Supabase JS 库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; }
        button { padding: 10px 20px; cursor: pointer; background: #0070f3; color: white; border: none; border-radius: 5px; }
        .hidden { display: none; }
        #message { color: red; margin-top: 10px; }
        .success { color: green; }
    </style>
</head>
<body>

    <!-- ===== 未登录时显示：注册 & 登录表单 ===== -->
    <div id="auth-container">
        <h2>注册</h2>
        <div class="form-group">
            <input type="email" id="reg-email" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <input type="password" id="reg-password" placeholder="请输入密码（至少6位）">
        </div>
        <button onclick="handleSignUp()">注册</button>

        <hr style="margin: 30px 0;">

        <h2>登录</h2>
        <div class="form-group">
            <input type="email" id="login-email" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
            <input type="password" id="login-password" placeholder="请输入密码">
        </div>
        <button onclick="handleSignIn()">登录</button>
        <div id="message"></div>
    </div>

    <!-- ===== 登录成功后显示：用户信息 & 退出按钮 ===== -->
    <div id="user-container" class="hidden">
        <h2>✅ 已登录</h2>
        <p>欢迎，<span id="user-email"></span>！</p>
        <button onclick="handleSignOut()">退出登录</button>
        <div id="user-message"></div>
    </div>

    <script>
        // ================= 1. 初始化 Supabase =================
        // ⚠️ 重要：请务必替换成你在后台重新生成的新 anon 密钥！
        const supabaseUrl = 'https://yruzwtugitxfmflbtdfp.supabase.co';
        const supabaseKey = 'sb_publishable_ZuiLf2QX-6HB82kvEDLErQ_ML289S4m';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ================= 2. 核心函数 =================
        // 注册
        async function handleSignUp() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const msg = document.getElementById('message');

            if (!email || password.length < 6) {
                msg.textContent = '请填写有效邮箱，且密码至少6位';
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: password,
            });

            if (error) {
                msg.textContent = '❌ 注册失败：' + error.message;
            } else {
                msg.className = 'success';
                msg.textContent = '✅ 注册成功！请查收邮箱点击确认链接（如未收到，请检查垃圾箱）。';
                // 如果你的 Supabase 关闭了邮箱确认，则这里可以直接登录成功，页面会自动切换。
                // 若开启了确认，用户点击确认邮件后，刷新页面或再次登录即可。
            }
        }

        // 登录
        async function handleSignIn() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const msg = document.getElementById('message');

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msg.textContent = '❌ 登录失败：' + error.message;
            } else {
                msg.className = 'success';
                msg.textContent = '✅ 登录成功！';
                // 登录成功后，获取会话并切换界面
                await checkUser();
            }
        }

        // 退出登录
        async function handleSignOut() {
            await supabase.auth.signOut();
            // 切换回登录界面
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('user-container').classList.add('hidden');
            document.getElementById('message').textContent = '已退出';
            document.getElementById('message').className = '';
        }

        // ================= 3. 检查当前用户会话（页面加载时自动执行） =================
        async function checkUser() {
            const { data: { session }, error } = await supabase.auth.getSession();

            if (session && session.user) {
                // 已登录：显示用户界面
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('user-container').classList.remove('hidden');
                document.getElementById('user-email').textContent = session.user.email;
                // 清除登录框里的提示信息
                document.getElementById('message').textContent = '';
            } else {
                // 未登录：显示登录注册界面
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('user-container').classList.add('hidden');
            }
        }

        // 页面加载时检查登录状态
        window.onload = function() {
            checkUser();

            // 监听认证状态变化（比如用户在新标签页退出登录，本页面会自动感知）
            supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' && session) {
                    document.getElementById('auth-container').classList.add('hidden');
                    document.getElementById('user-container').classList.remove('hidden');
                    document.getElementById('user-email').textContent = session.user.email;
                }
                if (event === 'SIGNED_OUT') {
                    document.getElementById('auth-container').classList.remove('hidden');
                    document.getElementById('user-container').classList.add('hidden');
                }
            });
        };
    </script>
</body>
</html>
