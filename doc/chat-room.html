<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>聊天室 | 小陈同学-STUCDX</title>
  <meta name="description" content="基于 GitHub Gist 的轻量级聊天室" />
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
            border: 'hsl(var(--border))',
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            ring: 'hsl(var(--ring))',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 222.2 84% 4.9%;
      --card: 0 0% 100%;
      --card-foreground: 222.2 84% 4.9%;
      --primary: 221.2 83.2% 53.3%;
      --primary-foreground: 210 40% 98%;
      --muted: 210 40% 96.1%;
      --muted-foreground: 215.4 16.3% 46.9%;
      --accent: 210 40% 96.1%;
      --accent-foreground: 222.2 47.4% 11.2%;
      --border: 214.3 31.8% 91.4%;
      --ring: 221.2 83.2% 53.3%;
    }
    .dark {
      --background: 222.2 84% 4.9%;
      --foreground: 210 40% 98%;
      --card: 222.2 84% 4.9%;
      --card-foreground: 210 40% 98%;
      --primary: 217.2 91.2% 59.8%;
      --primary-foreground: 222.2 47.4% 11.2%;
      --muted: 217.2 32.6% 17.5%;
      --muted-foreground: 215 20.2% 65.1%;
      --accent: 217.2 32.6% 17.5%;
      --accent-foreground: 210 40% 98%;
      --border: 217.2 32.6% 17.5%;
      --ring: 224.3 76.3% 48%;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      transition: background-color 0.3s, color 0.3s;
    }
    .nav-link {
      color: hsl(var(--muted-foreground));
      transition: color 0.2s;
      text-decoration: none;
    }
    .nav-link:hover {
      color: hsl(var(--foreground));
    }
    .lucide-icon {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: middle;
    }

    /* ===== 聊天室专用样式 ===== */
    .chat-app {
      max-width: 720px;
      width: 100%;
      background: hsl(var(--card));
      border-radius: 1.5rem;
      border: 1px solid hsl(var(--border));
      display: flex;
      flex-direction: column;
      height: 85vh;
      max-height: 800px;
      overflow: hidden;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .msg-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: hsl(var(--background));
      transition: background-color 0.3s;
    }

    .msg-item {
      display: flex;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
      animation: fadeIn 0.2s ease;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .msg-item .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 13px;
      flex-shrink: 0;
    }

    .msg-item .body {
      flex: 1;
      min-width: 0;
    }

    .msg-item .body .user {
      font-weight: 600;
      font-size: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: hsl(var(--foreground));
    }

    .msg-item .body .user .time {
      font-weight: 400;
      font-size: 11px;
      color: hsl(var(--muted-foreground));
    }

    .msg-item .body .text {
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
      margin-top: 2px;
      white-space: pre-wrap;
      color: hsl(var(--foreground));
    }

    .msg-item .body .text img {
      max-width: 100%;
      border-radius: 8px;
      margin: 4px 0;
    }

    .msg-item .body .text a {
      color: hsl(var(--primary));
      text-decoration: underline;
      font-weight: 500;
    }
    .msg-item .body .text a:hover {
      opacity: 0.8;
    }

    .empty {
      text-align: center;
      color: hsl(var(--muted-foreground));
      padding: 40px 10px;
      font-size: 15px;
    }

    .input-area {
      padding: 12px 20px 18px;
      border-top: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      display: flex;
      gap: 10px;
      align-items: flex-end;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .input-area textarea {
      flex: 1;
      border: 1px solid hsl(var(--border));
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 15px;
      resize: none;
      outline: none;
      font-family: inherit;
      min-height: 44px;
      max-height: 120px;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.3s, color 0.3s;
    }

    .input-area textarea:focus {
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 3px hsl(var(--ring) / 0.15);
    }

    .input-area textarea::placeholder {
      color: hsl(var(--muted-foreground));
    }

    .input-area .send-btn {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border: none;
      border-radius: 40px;
      padding: 10px 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      height: 44px;
      white-space: nowrap;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .input-area .send-btn:hover {
      background: hsl(var(--primary) / 0.85);
    }

    .input-area .send-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .badge {
      background: hsl(var(--muted));
      padding: 4px 14px;
      border-radius: 40px;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      transition: background-color 0.3s, color 0.3s;
    }

    .badge.success {
      background: hsl(142 76% 36% / 0.15);
      color: hsl(142 76% 36%);
    }
    .badge.error {
      background: hsl(0 84% 60% / 0.15);
      color: hsl(0 84% 60%);
    }
    .badge.loading {
      background: hsl(38 92% 50% / 0.15);
      color: hsl(38 92% 50%);
    }

    @keyframes fadeIn {
      from {
        opacity: 0.3;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Toast 样式与主站一致 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: hsl(var(--foreground));
      color: hsl(var(--background));
      padding: 12px 28px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 999;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error {
      background: hsl(0 84% 60%);
      color: #fff;
    }

    .chat-wrapper {
      padding: 24px 16px;
    }

    @media (max-width: 600px) {
      .chat-app {
        height: 92vh;
        max-height: none;
        border-radius: 16px;
      }
      .chat-wrapper {
        padding: 12px 8px;
      }
      .header {
        padding: 14px 16px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .input-area {
        padding: 10px 14px 16px;
        flex-wrap: wrap;
      }
      .input-area textarea {
        min-height: 40px;
      }
      .input-area .send-btn {
        padding: 10px 18px;
        font-size: 14px;
      }
    }

    /* 滚动条美化 */
    .msg-list::-webkit-scrollbar {
      width: 5px;
    }
    .msg-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .msg-list::-webkit-scrollbar-thumb {
      background: hsl(var(--muted-foreground) / 0.3);
      border-radius: 10px;
    }
    .msg-list::-webkit-scrollbar-thumb:hover {
      background: hsl(var(--muted-foreground) / 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

 <object data="/nav.html" type="text/html" style="width:100%; height:60px; display:block;"></object>
  <!-- ===== 聊天室主体 ===== -->
  <main class="flex-1 flex items-center justify-center chat-wrapper">
    <div class="chat-app">
      <!-- 聊天室头部 -->
      <div class="header p-4 border-b border-border flex justify-between items-center bg-card/50" style="background:hsl(var(--card));padding:14px 20px;border-bottom:1px solid hsl(var(--border));">
        <h2 class="text-lg font-semibold flex items-center gap-2 text-foreground">💬 Gist 聊天室</h2>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="badge" id="statusBadge">未连接</span>
          <button class="btn inline-flex items-center justify-center rounded-md text-sm font-medium hover:bg-accent hover:text-accent-foreground h-8 w-8 bg-transparent border border-border cursor-pointer transition-colors" id="refreshBtn" aria-label="刷新">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9"/></svg>
          </button>
        </div>
      </div>

      <!-- 消息列表 -->
      <div class="msg-list" id="msgList">
        <div class="empty">💡 配置 Gist ID 和 Token 后自动加载</div>
      </div>

      <!-- 输入区 -->
      <div class="input-area">
        <textarea id="msgInput" rows="1" placeholder="输入消息…（支持 Markdown 和图片链接）"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
    </div>
  </main>

  <!-- Toast 提示 -->
  <div class="toast" id="toast"></div>

  <!-- ===== 页脚（与第一个文件一致） ===== -->
  <footer class="bg-muted/50 py-12 mt-auto">
    <div class="container mx-auto px-4 text-center">
      <div class="mb-6"><h3 class="text-2xl font-bold">小陈同学-STUCDX</h3></div>
      <p class="text-muted-foreground mb-6">最懂科学的天才，最有品味的坏蛋 ——弗兰熊</p>
      <div class="flex flex-wrap justify-center items-center gap-x-6 gap-y-2 text-sm text-muted-foreground">
        <a class="hover:text-foreground transition-colors no-underline" href="/doc/privacy.html">隐私政策</a>
        <a href="https://www.acgo.cn/person/5336808" target="_blank" rel="noopener noreferrer" class="hover:text-foreground transition-colors no-underline">个人主页</a>
      </div>
    </div>
  </footer>

  <script>
    // ============================================================
    //  🔧 在这里填你的 Gist ID 和 Token
    // ============================================================
    const GIST_ID = '4781afc935389a6f42ed0a6d4725b3ed';
    const TOKEN = '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';
    // ============================================================

    // ===== 主题切换（与第一个文件一致） =====
    (function() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else if (stored === 'light') {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcons();
    })();

    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        localStorage.setItem('theme', 'dark');
      }
      updateThemeIcons();
    }

    function updateThemeIcons() {
      const isDark = document.documentElement.classList.contains('dark');
      const sunIcon = document.getElementById('sun-icon');
      const moonIcon = document.getElementById('moon-icon');
      if (sunIcon && moonIcon) {
        if (isDark) {
          sunIcon.classList.add('hidden');
          moonIcon.classList.remove('hidden');
        } else {
          sunIcon.classList.remove('hidden');
          moonIcon.classList.add('hidden');
        }
      }
    }

    // ===== 聊天室逻辑（功能保持不变） =====
    const msgList = document.getElementById('msgList');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const statusBadge = document.getElementById('statusBadge');
    const toastEl = document.getElementById('toast');

    let toastTimer = null;
    let isConnected = false;

    function showToast(msg, isError = false) {
      if (toastTimer) clearTimeout(toastTimer);
      toastEl.textContent = msg;
      toastEl.className = 'toast' + (isError ? ' error' : '');
      toastEl.classList.add('show');
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
        toastTimer = null;
      }, 3000);
    }

    function setStatus(text, type = '') {
      statusBadge.textContent = text;
      statusBadge.className = 'badge' + (type ? ' ' + type : '');
    }

    async function fetchComments() {
      const url = `https://api.github.com/gists/${GIST_ID}/comments`;
      const resp = await fetch(url, {
        headers: {
          'Authorization': 'token ' + TOKEN,
          'Accept': 'application/vnd.github.v3+json',
        },
      });
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error('获取评论失败: ' + resp.status + ' ' + err);
      }
      return await resp.json();
    }

    async function sendComment(body) {
      const url = `https://api.github.com/gists/${GIST_ID}/comments`;
      const resp = await fetch(url, {
        method: 'POST',
        headers: {
          'Authorization': 'token ' + TOKEN,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ body }),
      });
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error('发送失败: ' + resp.status + ' ' + err);
      }
      return await resp.json();
    }

    function renderMessages(comments) {
      if (!comments || comments.length === 0) {
        msgList.innerHTML = `<div class="empty">💬 还没有消息，发一条吧</div>`;
        return;
      }
      let html = '';
      const sorted = [...comments].reverse();
      for (const c of sorted) {
        const user = c.user?.login || 'anonymous';
        const avatar = c.user?.avatar_url || '';
        const time = c.created_at ? new Date(c.created_at).toLocaleString('zh-CN', { hour12: false }) : '';
        let body = c.body || '';
        // 图片链接自动渲染
        body = body.replace(/(https?:\/\/[^\s]+\.(png|jpg|jpeg|gif|svg|webp))/gi, (match) => {
          return `<img src="${match}" alt="image" loading="lazy" style="max-width:100%;border-radius:8px;margin:4px 0;" />`;
        });
        // 普通链接
        body = body.replace(/(https?:\/\/[^\s]+)/gi, (match) => {
          if (match.match(/\.(png|jpg|jpeg|gif|svg|webp)$/i)) return match;
          return `<a href="${match}" target="_blank">${match}</a>`;
        });
        const initial = user.charAt(0).toUpperCase();
        html += `
          <div class="msg-item">
            <div class="avatar" style="${avatar ? `background-image:url(${avatar});background-size:cover;background-position:center;text-indent:-999px;` : ''}">${initial}</div>
            <div class="body">
              <div class="user">
                <span>${user}</span>
                <span class="time">${time}</span>
              </div>
              <div class="text">${body}</div>
            </div>
          </div>
        `;
      }
      msgList.innerHTML = html;
      msgList.scrollTop = msgList.scrollHeight;
    }

    async function loadMessages() {
      if (!GIST_ID || !TOKEN) {
        setStatus('❌ 未配置', 'error');
        msgList.innerHTML = `<div class="empty">⚠️ 请先在代码中填写 GIST_ID 和 TOKEN</div>`;
        return;
      }
      try {
        setStatus('加载中…', 'loading');
        const comments = await fetchComments();
        isConnected = true;
        setStatus('✅ 已连接', 'success');
        renderMessages(comments);
      } catch (e) {
        isConnected = false;
        setStatus('❌ 失败', 'error');
        showToast('加载失败: ' + e.message, true);
        msgList.innerHTML = `<div class="empty">⚠️ 加载失败: ${e.message}</div>`;
      }
    }

    async function handleSend() {
      const text = msgInput.value.trim();
      if (!text) {
        showToast('请输入消息', true);
        return;
      }
      if (!isConnected) {
        showToast('请先连接 Gist', true);
        return;
      }
      sendBtn.disabled = true;
      try {
        await sendComment(text);
        msgInput.value = '';
        await loadMessages();
        showToast('✅ 已发送');
      } catch (e) {
        showToast('发送失败: ' + e.message, true);
      }
      sendBtn.disabled = false;
      msgInput.focus();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    refreshBtn.addEventListener('click', loadMessages);
    sendBtn.addEventListener('click', handleSend);

    msgInput.addEventListener('input', function() {
      autoResize(this);
    });

    msgInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    // 启动
    loadMessages();

    // 每15秒自动刷新
    setInterval(() => {
      if (isConnected) {
        loadMessages().catch(() => {});
      }
    }, 15000);

    console.log('💬 Gist 聊天室已启动');
    console.log('GIST_ID:', GIST_ID);
  </script>
</body>
</html>
